name: Browser development checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libgl-dev libglx-dev libegl-dev libxkbcommon-dev libfontconfig1 libxcb-cursor0 libnss3 libasound2t64 xvfb
      - run: python -m pip install aqtinstall==3.3.0
      - run: python -m aqt install-qt linux desktop 6.11.3 linux_gcc_64 -O .local-tools/Qt -m qtwebengine qtwebchannel qtpositioning qtshadertools qttasktree
      - run: scripts/build_browser.sh
      - run: ctest --test-dir build --output-on-failure
      - run: python -m unittest discover -s tests
      - name: QML interaction regressions
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          XDG_DATA_HOME: ${{ runner.temp }}/angle-qml/data
          XDG_CONFIG_HOME: ${{ runner.temp }}/angle-qml/config
          XDG_CACHE_HOME: ${{ runner.temp }}/angle-qml/cache
        run: .local-tools/Qt/6.11.3/gcc_64/bin/qmltestrunner -input tests/qml -o -,txt
