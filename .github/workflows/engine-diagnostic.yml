name: Known-blocked Qt extension diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libgl-dev libglx-dev libegl-dev libxkbcommon-dev libfontconfig1 libxcb-cursor0 libnss3 libasound2t64 xvfb
      - run: python -m pip install aqtinstall==3.3.0
      - run: python -m aqt install-qt linux desktop 6.11.3 linux_gcc_64 -O .local-tools/Qt -m qtwebengine qtwebchannel qtpositioning qtshadertools qttasktree
      - run: scripts/build_browser.sh
      - run: xvfb-run -a python scripts/test_engine.py
